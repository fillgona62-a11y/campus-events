# sshd hardening drop-in for campus-events (S3).
# Write to /etc/ssh/sshd_config.d/99-hardening.conf, then:
#   sudo sshd -t                 # syntax check (no output = OK)
#   sudo systemctl restart sshd  # do NOT close the current window until a new
#                                # key-based login is verified (RB-03)
#
# Prerequisite: key-based login MUST already work. Order matters —
# disabling password auth before verifying key access locks you out.
# Recovery path: AWS EC2 console -> Instance Connect (browser terminal).

# Key-only login: reject password brute-force scans
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Root account: no direct root login (use a normal user + sudo)
PermitRootLogin no

# Limit authentication attempts per connection
MaxAuthTries 3

# Idle sessions auto-disconnect (seconds)
ClientAliveInterval 300
ClientAliveCountMax 3
