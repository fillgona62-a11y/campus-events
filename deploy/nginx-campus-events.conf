# Nginx template for campus-events (S1: HTTPS).
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled,
# or adapt into an existing server block. Replace your-domain.example.com
# with the real domain, then: sudo nginx -t && sudo systemctl reload nginx.
#
# Certbot (Let's Encrypt): sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.example.com

# HTTP(80) -> HTTPS(443) full redirect
server {
  listen 80;
  listen [::]:80;
  server_name your-domain.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name your-domain.example.com;

  # TLS certificates (certbot fills these paths automatically)
  ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

  # Upload body limit must cover the 2MB cover image plus multipart overhead
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
